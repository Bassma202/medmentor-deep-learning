<!DOCTYPE html>
<html>
<head>
    <title>MedMentor - Welcome</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 

            /* BACKGROUND IMAGE */
            background: url('images/skin-bg.jpg');
            background-size: contain;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Overlay pour rendre lisible */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.2);
            z-index: 0;
        }

        .box { 
            position: relative;
            z-index: 1;

            background: rgba(255,255,255,0.95); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 450px;
        }

        h1 { 
            font-size: 30px; 
            margin-bottom: 15px; 
        }

        p { 
            font-size: 15px; 
            color: #555; 
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .disclaimer {
            font-size: 13px;
            color: #999;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 15px 30px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background: #5751d1;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🩺 MedMentor AI</h1>

    <p>
        MedMentor is an AI-powered educational assistant designed to help users 
        analyze skin lesions through image classification.
    </p>

    <p class="disclaimer">
        ⚠️ This tool is for educational purposes only and does not replace 
        professional medical diagnosis. Always consult a dermatologist.
    </p>

    <a href="app.html">Continue</a>
</div>

</body>
</html>
